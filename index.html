---
layout: null
---
<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1b1026">
  <title>{{ site.title }}</title>
  <meta name="apple-mobile-web-app-title" content="{{ site.short_title | default: site.title }}">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="icon" type="image/png" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>
    // Pick this month's theme before the page draws, so it doesn't flash.
    // To preview another month, add ?month=6 (1-12) to the address.
    (function () {
      var THEMES = [
        { name: "winter",       emoji: "❄️", color: "#e8f2fc", font: "Snowburst+One" },             // Jan
        { name: "valentine",    emoji: "💖", color: "#fff0f4", font: "Pacifico" },                  // Feb
        { name: "spring",       emoji: "🐣", color: "#fffbe6", font: "Fredoka:wght@600" },          // Mar
        { name: "wildflowers",  emoji: "🌼", color: "#f4f8ee", font: "Satisfy" },                   // Apr
        { name: "mayday",       emoji: "🌹", color: "#fbf3e6", font: "Bebas+Neue" },                // May
        { name: "pride",        emoji: "🏳️‍🌈", color: "#faf7ff", font: "Fredoka:wght@700" },          // Jun
        { name: "july",         emoji: "🇺🇸", color: "#e6f5fc", font: "Alfa+Slab+One" },             // Jul
        { name: "beach",        emoji: "🏖️", color: "#dff4f7", font: "Shrikhand" },                 // Aug
        { name: "autumn",       emoji: "🍂", color: "#f8eee2", font: "Caveat+Brush" },              // Sep
        { name: "halloween",    emoji: "🎃", color: "#1b1026", font: "Creepster" },                 // Oct
        { name: "thanksgiving", emoji: "🦃", color: "#fbf1e3", font: "Lobster" },                   // Nov
        { name: "christmas",    emoji: "🎄", color: "#143f30", font: "Mountains+of+Christmas:wght@700" } // Dec
      ];
      var month = new Date().getMonth();
      var forced = /[?&]month=(\d{1,2})/.exec(location.search);
      if (forced && +forced[1] >= 1 && +forced[1] <= 12) month = +forced[1] - 1;
      else forced = null;
      var t = THEMES[month];
      document.documentElement.setAttribute("data-theme", t.name);
      document.querySelector('meta[name="theme-color"]').setAttribute("content", t.color);
      var font = document.createElement("link");
      font.rel = "stylesheet";
      font.href = "https://fonts.googleapis.com/css2?family=" + t.font + "&display=swap";
      document.head.appendChild(font);
      window.TODO_THEME = { theme: t, month: month, forced: !!forced };
    })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>

  <main class="screen">
    <header>
      <h1><span id="theme-emoji" aria-hidden="true"></span> <span class="title-text">{{ site.title }}</span></h1>
    </header>

    <button type="button" id="new-btn" class="new-btn">+ New To Do</button>

    <section class="card">
      <h2>Events</h2>
      <ul id="events"></ul>
      <p id="events-empty" class="empty">No events yet.</p>
    </section>

    <section class="card">
      <h2>To Do <span id="todo-count" class="count"></span></h2>
      <ul id="todos"></ul>
      <p id="todos-empty" class="empty">Nothing to do.</p>
      <button type="button" id="clear-done" class="link" hidden>Clear checked items</button>
    </section>
  </main>

  <!-- "New To Do" pop-up -->
  <dialog id="new-dialog" aria-labelledby="new-title">
    <form id="new-form" class="dialog-body" autocomplete="off">
      <h3 id="new-title">New item</h3>

      <div class="segmented" role="radiogroup" aria-label="Type">
        <button type="button" role="radio" data-kind="event" aria-checked="false">Event</button>
        <button type="button" role="radio" data-kind="todo" aria-checked="true">To Do</button>
      </div>

      <div>
        <label for="item-text">What</label>
        <input id="item-text" type="text" required placeholder="Pick up diapers">
      </div>

      <div id="event-fields" hidden>
        <label for="item-time">Time</label>
        <input id="item-time" type="time">
        <label for="item-location" class="spaced">Location</label>
        <input id="item-location" type="text" placeholder="Optional">
      </div>

      <div class="actions">
        <button type="button" id="cancel-btn" class="ghost">Cancel</button>
        <button type="submit">Add</button>
      </div>
    </form>
  </dialog>

  <script src="{{ '/assets/app.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
